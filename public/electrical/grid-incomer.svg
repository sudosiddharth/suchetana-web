<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="title desc">
<title id="title">Utility grid incomer and double-pole structure</title><desc id="desc">A detailed electrical utility incomer with double-pole structure, crossarms, glazed insulators, gang-operated switch, lightning arresters, drop-out fuses, earthing and three animation-ready incoming phase paths.</desc>
<defs><linearGradient id="z" x1="0" x2="1"><stop stop-color="#4e5359"/><stop offset=".5" stop-color="#c6c8cc"/><stop offset="1" stop-color="#4e5359"/></linearGradient><radialGradient id="p" cx="35%" cy="20%"><stop stop-color="#c89bea"/><stop offset=".35" stop-color="#7a22c4"/><stop offset="1" stop-color="#2e0650"/></radialGradient><linearGradient id="c"><stop stop-color="#580e8f"/><stop offset=".8" stop-color="#c89bea"/><stop offset="1" stop-color="#e0b85b"/></linearGradient><filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><g id="pin"><path d="M0 0V-56" stroke="#60666d" stroke-width="8"/><ellipse cy="-18" rx="25" ry="8" fill="url(#p)"/><ellipse cy="-35" rx="21" ry="7" fill="url(#p)"/><ellipse cy="-51" rx="17" ry="6" fill="url(#p)"/></g><style>.s{fill:none;stroke:#3c4045;stroke-width:4;stroke-linejoin:round}.d{fill:none;stroke:#666c73;stroke-width:2}.live{fill:none;stroke:url(#c);stroke-width:8;stroke-linecap:round;filter:url(#g);opacity:0}.guide{fill:none;stroke:#60666d;stroke-width:7;opacity:.32}.label{font:600 14px system-ui,sans-serif;letter-spacing:.13em;fill:#4e5359}</style></defs>
<ellipse cx="480" cy="700" rx="360" ry="28" fill="#16131a" opacity=".13"/>
<g id="poles"><path d="M250 122L222 680H290L274 122Z" fill="url(#z)" class="s"/><path d="M686 122L670 680H738L710 122Z" fill="url(#z)" class="s"/><path d="M222 680H290M670 680H738" stroke="#292c30" stroke-width="16"/><path d="M235 270H721M229 402H727" stroke="url(#z)" stroke-width="27" class="s"/><path d="M210 250H746V289H210ZM204 382H752V421H204Z" fill="#797f86" opacity=".35"/></g>
<g id="bracing" class="d"><path d="M250 122L710 680M710 122L250 680M238 270L720 402M722 270L230 402"/></g>
<g id="insulators"><g transform="translate(326 250)"><use href="#pin"/></g><g transform="translate(478 250)"><use href="#pin"/></g><g transform="translate(630 250)"><use href="#pin"/></g><g transform="translate(326 382)"><use href="#pin"/></g><g transform="translate(478 382)"><use href="#pin"/></g><g transform="translate(630 382)"><use href="#pin"/></g></g>
<g id="gang-switch" class="s"><circle cx="326" cy="330" r="10" fill="#d6a84c"/><circle cx="478" cy="330" r="10" fill="#d6a84c"/><circle cx="630" cy="330" r="10" fill="#d6a84c"/><path id="switch-a" d="M335 324L388 292"/><path id="switch-b" d="M487 324L540 292"/><path id="switch-c" d="M639 324L692 292"/><path d="M326 330V361M478 330V361M630 330V361"/><path d="M692 292V465H735" stroke-width="7"/><circle cx="735" cy="465" r="13" fill="#d6a84c"/></g>
<g id="dropout-fuses"><g transform="translate(326 456)"><path d="M0-36V36" stroke="#d6a84c" stroke-width="9"/><rect x="-13" y="-18" width="26" height="36" rx="8" fill="#580e8f" class="s"/></g><g transform="translate(478 456)"><path d="M0-36V36" stroke="#d6a84c" stroke-width="9"/><rect x="-13" y="-18" width="26" height="36" rx="8" fill="#580e8f" class="s"/></g><g transform="translate(630 456)"><path d="M0-36V36" stroke="#d6a84c" stroke-width="9"/><rect x="-13" y="-18" width="26" height="36" rx="8" fill="#580e8f" class="s"/></g></g>
<g id="lightning-arresters"><g transform="translate(376 525)"><path d="M0-58V48" stroke="#4e5359" stroke-width="8"/><ellipse cy="-30" rx="20" ry="7" fill="url(#p)"/><ellipse cy="-10" rx="18" ry="6" fill="url(#p)"/><ellipse cy="10" rx="16" ry="6" fill="url(#p)"/></g><g transform="translate(528 525)"><path d="M0-58V48" stroke="#4e5359" stroke-width="8"/><ellipse cy="-30" rx="20" ry="7" fill="url(#p)"/><ellipse cy="-10" rx="18" ry="6" fill="url(#p)"/><ellipse cy="10" rx="16" ry="6" fill="url(#p)"/></g><g transform="translate(680 525)"><path d="M0-58V48" stroke="#4e5359" stroke-width="8"/><ellipse cy="-30" rx="20" ry="7" fill="url(#p)"/><ellipse cy="-10" rx="18" ry="6" fill="url(#p)"/><ellipse cy="10" rx="16" ry="6" fill="url(#p)"/></g></g>
<g id="earthing"><path d="M735 478V650H820" fill="none" stroke="#5d8a63" stroke-width="8"/><path d="M790 650H850M800 664H840M810 678H830" stroke="#5d8a63" stroke-width="5"/><text x="854" y="660" class="label">EARTH</text></g>
<path id="phase-r-guide" class="guide" d="M-40 165H326V330V456V628H1000"/><path id="phase-y-guide" class="guide" d="M-40 205H478V330V456V604H1000"/><path id="phase-b-guide" class="guide" d="M-40 245H630V330V456V580H1000"/>
<path id="phase-r" class="live" d="M-40 165H326V330V456V628H1000"/><path id="phase-y" class="live" d="M-40 205H478V330V456V604H1000"/><path id="phase-b" class="live" d="M-40 245H630V330V456V580H1000"/>
<g id="labels"><text x="54" y="140" class="label">UTILITY SUPPLY</text><text x="845" y="558" class="label">TO TRANSFORMER</text></g>
</svg>