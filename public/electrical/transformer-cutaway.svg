<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="tx-title tx-desc">
<title id="tx-title">Monumental distribution transformer cutaway</title><desc id="tx-desc">A shallow-axonometric zinc transformer with three Oxford-purple bushings, cooling banks, conservator and a visible three-phase winding chamber.</desc>
<defs>
 <linearGradient id="tx-zinc" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d9dcdf"/><stop offset=".2" stop-color="#90969d"/><stop offset=".58" stop-color="#555b62"/><stop offset="1" stop-color="#2b2f34"/></linearGradient>
 <linearGradient id="tx-side" x1="0" x2="1"><stop stop-color="#676d74"/><stop offset="1" stop-color="#30343a"/></linearGradient>
 <radialGradient id="tx-purple" cx="32%" cy="20%" r="75%"><stop stop-color="#dfc0f4"/><stop offset=".25" stop-color="#9f55d4"/><stop offset=".68" stop-color="#580e8f"/><stop offset="1" stop-color="#24043f"/></radialGradient>
 <linearGradient id="tx-live" x1="0" x2="1"><stop stop-color="#580e8f"/><stop offset=".72" stop-color="#c89bea"/><stop offset="1" stop-color="#e0b85b"/></linearGradient>
 <filter id="tx-shadow" x="-30%" y="-30%" width="170%" height="190%"><feDropShadow dx="10" dy="28" stdDeviation="24" flood-color="#000" flood-opacity=".42"/></filter>
 <filter id="tx-glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <g id="tx-disc"><ellipse rx="37" ry="10" fill="#24043f"/><ellipse cy="-5" rx="40" ry="11" fill="url(#tx-purple)"/><path d="M-23-8Q0-18 23-8" fill="none" stroke="#ead8f7" stroke-width="4" stroke-linecap="round" opacity=".65"/></g>
</defs>
<ellipse cx="500" cy="695" rx="390" ry="38" fill="#000" opacity=".28"/>
<g id="transformer-cutaway" filter="url(#tx-shadow)">
