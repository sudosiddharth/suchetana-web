<text x="256" y="156" class="cap">PROJECT ENQUIRY · ELECTRICAL TITLE BLOCK</text><text x="256" y="236" class="title">Your project</text><text x="256" y="283" class="key">UNENERGISED · READY FOR FIRST REVIEW</text>
