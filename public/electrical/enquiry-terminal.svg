<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc"><title id="title">Unenergised new-project enquiry terminal</title><desc id="desc">A lime electrical drawing title block with open breaker contacts, an unenergised outgoing terminal and fields for project information issued to Madhusudan M.S.</desc><defs><linearGradient id="zn"><stop stop-color="#4e5359"/><stop offset=".5" stop-color="#c6c8cc"/><stop offset="1" stop-color="#4e5359"/></linearGradient><linearGradient id="live"><stop stop-color="#580e8f"/><stop offset=".78" stop-color="#c89bea"/><stop offset="1" stop-color="#e0b85b"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#16131a" flood-opacity=".2"/></filter><filter id="gl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.ink{fill:none;stroke:#16131a;stroke-width:3;stroke-linejoin:round}.thin{fill:none;stroke:#696472;stroke-width:1.5}.guide{fill:none;stroke:#7c8189;stroke-width:10;opacity:.32;stroke-linecap:round}.live{fill:none;stroke:url(#live);stroke-width:11;filter:url(#gl);opacity:0;stroke-linecap:round}.cap{font:700 12px system-ui,sans-serif;letter-spacing:.15em;fill:#580e8f}.title{font:700 62px system-ui,sans-serif;letter-spacing:-.035em;fill:#16131a}.key{font:700 11px system-ui,sans-serif;letter-spacing:.12em;fill:#696472}.val{font:700 22px system-ui,sans-serif;fill:#16131a}</style></defs>
<path d="M0 0H1120V700H0Z" fill="#b4b7bc"/>
