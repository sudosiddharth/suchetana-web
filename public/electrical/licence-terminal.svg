<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc"><title id="title">Madhusudan M.S. Class I licence terminal</title><desc id="desc">An engraved zinc electrical identification plate with incoming live terminal, contractor and supervisor licence fields, inspection seal and animation-ready current path.</desc><defs><linearGradient id="zn" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d1d4d7"/><stop offset=".22" stop-color="#777d84"/><stop offset=".52" stop-color="#b8bcc1"/><stop offset=".78" stop-color="#5a6067"/><stop offset="1" stop-color="#34383d"/></linearGradient><radialGradient id="screw"><stop stop-color="#e1e3e5"/><stop offset=".55" stop-color="#747a81"/><stop offset="1" stop-color="#292c30"/></radialGradient><linearGradient id="live"><stop stop-color="#580e8f"/><stop offset=".8" stop-color="#c89bea"/><stop offset="1" stop-color="#e0b85b"/></linearGradient><filter id="sh" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#16131a" flood-opacity=".32"/></filter><filter id="gl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.guide{fill:none;stroke:#555b62;stroke-width:10;opacity:.28;stroke-linecap:round}.live{fill:none;stroke:url(#live);stroke-width:11;filter:url(#gl);opacity:0;stroke-linecap:round}.cap{font:700 13px system-ui,sans-serif;letter-spacing:.16em;fill:#c89bea}.name{font:700 64px system-ui,sans-serif;letter-spacing:-.035em;fill:#fff}.key{font:700 12px system-ui,sans-serif;letter-spacing:.12em;fill:#aeb2b6}.val{font:700 28px system-ui,sans-serif;letter-spacing:.02em;fill:#fff}</style></defs>
<path d="M0 0H1120V680H0Z" fill="#4e5359"/>
<path id="incoming-guide" class="guide" d="M-30 340H170"/><path id="incoming-current" class="live" d="M-30 340H170"/>
<g id="terminal"><circle cx="170" cy="340" r="46" fill="#25282c" stroke="#aeb2b6" stroke-width="5"/><circle cx="170" cy="340" r="22" fill="#580e8f" stroke="#c89bea" stroke-width="5"/><circle cx="170" cy="340" r="8" fill="#e0b85b"/></g>
<g id="plate" filter="url(#sh)"><path d="M196 92H1040L1080 132V548L1040 588H196L156 548V132Z" fill="url(#zn)" stroke="#25282c" stroke-width="4"/><path d="M210 128H1028L1044 144V532L1028 550H210L192 532V144Z" fill="#25282c" stroke="#a9adb2" stroke-width="2"/>
<g id="mounting-screws" fill="url(#screw)" stroke="#202327" stroke-width="2"><circle cx="220" cy="154" r="18"/><circle cx="1016" cy="154" r="18"/><circle cx="220" cy="524" r="18"/><circle cx="1016" cy="524" r="18"/></g><g stroke="#35393e" stroke-width="3"><path d="M209 154H231M1016 143V165M209 524H231M1005 524H1027"/></g>
<text x="276" y="190" class="cap">CLASS I ELECTRICAL CONTRACTOR · ACTIVE PROPRIETOR</text><text x="276" y="276" class="name">Madhusudan M.S.</text><path d="M276 310H968" stroke="#666c73" stroke-width="2"/>
<g id="licence-fields"><text x="276" y="354" class="key">CONTRACTOR LICENCE</text><text x="276" y="394" class="val">1CL192563BNG</text><text x="660" y="354" class="key">SUPERVISOR LICENCE</text><text x="660" y="394" class="val">1SP191691BNG</text><text x="276" y="456" class="key">FIRM ESTABLISHED</text><text x="276" y="496" class="val">1969</text><text x="500" y="456" class="key">CURRENT RESPONSIBILITY</text><text x="500" y="496" class="val">PROPRIETOR</text></g>
<g id="inspection-seal" transform="translate(927 457)"><circle r="58" fill="none" stroke="#c89bea" stroke-width="3"/><circle r="46" fill="none" stroke="#c89bea" stroke-width="1" stroke-dasharray="5 5"/><path d="M-24 0L-7 18L29-24" fill="none" stroke="#e0b85b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text y="78" text-anchor="middle" class="cap">ACCOUNTABLE</text></g></g>
<path id="plate-current-guide" class="guide" d="M170 340H276V310H968"/><path id="plate-current" class="live" d="M170 340H276V310H968"/>
</svg>