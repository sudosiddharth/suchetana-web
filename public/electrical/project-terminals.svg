<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc"><title id="title">Three verified project terminals</title><desc id="desc">Three distinct vector terminals represent state infrastructure, a commercial installation and a residential installation, with animation-ready incoming feeder paths.</desc><defs><linearGradient id="zn"><stop stop-color="#4e5359"/><stop offset=".48" stop-color="#c6c8cc"/><stop offset="1" stop-color="#4e5359"/></linearGradient><radialGradient id="p"><stop stop-color="#c89bea"/><stop offset=".4" stop-color="#7a22c4"/><stop offset="1" stop-color="#2e0650"/></radialGradient><linearGradient id="live"><stop stop-color="#580e8f"/><stop offset=".8" stop-color="#c89bea"/><stop offset="1" stop-color="#e0b85b"/></linearGradient><filter id="gl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.o{fill:none;stroke:#41464c;stroke-width:4;stroke-linejoin:round}.d{fill:none;stroke:#666c73;stroke-width:2}.guide{fill:none;stroke:#596067;stroke-width:9;opacity:.25;stroke-linecap:round}.live{fill:none;stroke:url(#live);stroke-width:10;filter:url(#gl);opacity:0;stroke-linecap:round}.label{font:700 14px system-ui,sans-serif;letter-spacing:.13em;fill:#4e5359}.load{font:700 46px system-ui,sans-serif;letter-spacing:-.03em;fill:#16131a}.meta{font:500 14px system-ui,sans-serif;fill:#696472}</style></defs>
