<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="title desc"><title id="title">HT metering and vacuum circuit breaker panel</title><desc id="desc">A detailed high-tension panel lineup showing metering, relay protection, vacuum circuit breaker truck, bus coupler, cable chamber, earthing switch and animation-ready breaker contacts.</desc><defs><linearGradient id="zn" x1="0" x2="1"><stop stop-color="#52575e"/><stop offset=".38" stop-color="#b7bbc0"/><stop offset=".65" stop-color="#797f86"/><stop offset="1" stop-color="#3d4146"/></linearGradient><linearGradient id="live"><stop stop-color="#580e8f"/><stop offset=".8" stop-color="#c89bea"/><stop offset="1" stop-color="#e0b85b"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-opacity=".28"/></filter><filter id="gl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.o{stroke:#34383d;stroke-width:3;stroke-linejoin:round}.d{fill:none;stroke:#646a71;stroke-width:2}.t{font:700 13px system-ui,sans-serif;letter-spacing:.12em;fill:#d6d8db}.m{font:600 11px system-ui,sans-serif;letter-spacing:.08em;fill:#4e5359}.route{fill:none;stroke:url(#live);stroke-width:8;stroke-linecap:round;filter:url(#gl);opacity:0}.guide{fill:none;stroke:#5c6269;stroke-width:7;opacity:.28}</style></defs>
